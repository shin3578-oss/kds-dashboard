<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#111827">
<title>自動化ダッシュボード｜医療法人社団KDS</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f6f8; --card:#fff; --fg:#111827; --sub:#64748b; --line:#e5e9ee;
  --ok:#059669; --ok-bg:#e7f6f0; --ng:#dc2626; --ng-bg:#fdeaea;
  --warn:#d97706; --warn-bg:#fdf3e3; --idle:#94a3b8; --idle-bg:#eef1f5;
  --build:#7c3aed; --build-bg:#f1eafe;
  --shadow:0 1px 2px rgba(16,32,48,.05),0 3px 14px rgba(16,32,48,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --sub:#8b98a5; --line:#242c36;
  --ok:#3fb950; --ok-bg:#10261a; --ng:#f85149; --ng-bg:#2d1416;
  --warn:#d29922; --warn-bg:#2b2110; --idle:#6e7b8b; --idle-bg:#1b2029;
  --build:#a371f7; --build-bg:#221631;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 14px rgba(0,0,0,.35);
}}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:16px 14px 64px}

#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:30px 26px;max-width:380px;width:100%;text-align:center}
#gate h1{font-size:19px;margin:0 0 6px}
#gate p{color:var(--sub);font-size:13px;margin:0 0 18px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;letter-spacing:.08em}
#gate button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:700;cursor:pointer}
#gate .err{color:var(--ng);font-size:13px;height:18px;margin-top:8px}
#gate label{display:flex;gap:7px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin-top:12px}
#gate label input{width:auto}

header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
header h1{font-size:18px;margin:0}
.stamp{color:var(--sub);font-size:12px;margin:0 0 14px}
.stamp b{color:var(--fg)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.tile .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--sub);margin-top:2px}
.tile[data-k="ok"] .n{color:var(--ok)} .tile[data-k="ng"] .n{color:var(--ng)}
.tile[data-k="pause"] .n{color:var(--idle)} .tile[data-k="build"] .n{color:var(--build)}
.tile[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:-2px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.tile .n{font-size:26px}}

h2{font-size:14px;margin:22px 0 9px;color:var(--sub);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

.slot{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot.now{background:var(--warn-bg)}
.slot .t{flex:0 0 60px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.slot .t small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.slot .items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;border:1px solid transparent;cursor:pointer;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng);font-weight:700}
.pill.run{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.wait{background:var(--idle-bg);color:var(--sub)}
.pill.pause{background:var(--idle-bg);color:var(--idle);text-decoration:line-through}

.row{display:grid;grid-template-columns:26px 1fr 132px 96px 72px;gap:10px;align-items:center;
  padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.dot{width:11px;height:11px;border-radius:50%;justify-self:center}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)} .dot.run{background:var(--warn)}
.dot.wait{background:var(--idle)} .dot.pause{background:var(--idle);opacity:.45}
.dot.build{background:var(--build)}
.nm{min-width:0}
.nm b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;font-size:11.5px;color:var(--sub)}
.c{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.c.b{color:var(--ng);font-weight:700}
@media(max-width:700px){.row{grid-template-columns:22px 1fr auto;gap:8px}.c.next,.c.dur{display:none}}

.it{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.bd{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:0 0 auto}
.bd.hi{background:var(--ng)} .bd.mid{background:var(--warn)} .bd.lo{background:var(--idle)}
.it b{font-size:14px;font-weight:600;display:block}
.it p{margin:1px 0 0;font-size:12.5px;color:var(--sub)}
.it .due{font-size:11.5px;color:var(--sub);margin-left:auto;white-space:nowrap;padding-top:2px}

#quota{padding:14px}
#quota .hd{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);flex-wrap:wrap}
#quota .hd b{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--idle-bg);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.bar.w i{background:var(--warn)} .bar.d i{background:var(--ng)}
#quota .ft{font-size:12px;color:var(--sub);margin-top:7px}

#modal{position:fixed;inset:0;background:rgba(8,12,18,.55);display:none;place-items:center;padding:18px;z-index:50}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:84dvh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal h3{margin:0 0 3px;font-size:17px}
#modal .meta{font-size:12px;color:var(--sub);margin-bottom:14px}
#modal dl{display:grid;grid-template-columns:82px 1fr;gap:7px 12px;margin:0;font-size:13.5px}
#modal dt{color:var(--sub)} #modal dd{margin:0;word-break:break-word}
#modal .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#modal a,#modal .cls{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;text-decoration:none;color:inherit;cursor:pointer;background:var(--bg)}
.hist{display:flex;gap:4px;margin-top:10px}
.hist i{flex:1;height:22px;border-radius:3px;background:var(--idle-bg)}
.hist i.ok{background:var(--ok)} .hist i.ng{background:var(--ng)} .hist i.sk{background:var(--idle);opacity:.35}
.err{color:var(--ng)} .muted{color:var(--sub);font-size:12.5px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>自動化ダッシュボード</h1>
    <p>医療法人社団KDS</p>
    <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password" enterkeyhint="go">
    <button id="go">ひらく</button>
    <div class="err" id="ge"></div>
    <label><input type="checkbox" id="rem" checked>この端末では次から聞かない</label>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header><h1>自動化ダッシュボード</h1></header>
  <div class="stamp" id="stamp"></div>
  <div class="tiles" id="tiles"></div>

  <h2 id="tlh">本日の動き</h2>
  <div class="card" id="tl"></div>

  <h2>タスク一覧 <span class="muted" id="fmark"></span></h2>
  <div class="card" id="list"></div>

  <h2>残作業・見届け待ち</h2>
  <div class="card" id="todo"></div>

  <h2>GitHub Actions 無料枠</h2>
  <div class="card" id="quota"></div>
</div>

<div id="modal"><div class="box" id="mbox"></div></div>

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2a(ENC.salt), iterations:200000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(ENC.iv)}, key, b2a(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---- スケジュール（次回はブラウザの時計で毎回計算する） ---- */
const DOW = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function runsOn(t, d){
  const s = t.days || "manual";
  if(s === "manual") return false;
  if(s === "everyday") return true;
  if(s === "monthend") return d.getDate() === new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  if(s.startsWith("day:")){
    const spec = s.slice(4);
    if(spec.includes("-")){
      const [a,b] = spec.split("-").map(Number);
      // 月をまたぐ範囲（例 day:26-3 ＝ 26日から翌月3日まで）にも対応する。
      // a>b の折り返しを分けて判定しないと、そのタスクが「一度も動かない」
      // 扱いになり、ダッシュボードに次回実行が出なくなる。
      return a<=b ? (d.getDate()>=a && d.getDate()<=b)
                  : (d.getDate()>=a || d.getDate()<=b);
    }
    // 複数の日を指定する形（例 day:20,25 ＝ 毎月20日と25日）
    if(spec.includes(",")) return spec.split(",").map(Number).includes(d.getDate());
    return d.getDate() === Number(spec);
  }
  if(s.includes("-")){ const [a,b] = s.split("-").map(x => DOW[x]); return d.getDay()>=a && d.getDay()<=b; }
  return s.split(",").map(x => DOW[x]).includes(d.getDay());
}
/* 休診日（アポツールの rest-all）。曜日だけで計算すると、お盆や年末年始に
   止まっているタスクを「次回 月曜 8:50」と表示してしまうため必ず突き合わせる。
   カレンダーが空のときは従来どおり曜日だけで出す（読めない＝止める、にはしない）。 */
let CLOSED = new Set();
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function clinicOpen(t, d){
  const mode = t.clinic;                  // undefined / "today" / "tomorrow"
  if(!mode || !CLOSED.size) return true;
  if(mode === "today") return !CLOSED.has(ymd(d));
  const nx = new Date(d); nx.setDate(nx.getDate()+1);   // 翌日分を準備するタスク
  return !CLOSED.has(ymd(nx));
}
function nextRun(t){
  if(!t.at || t.days === "manual" || t.status === "paused") return null;
  const [h,m] = t.at.split(":").map(Number);
  for(let i=0;i<400;i++){
    const d = new Date(); d.setDate(d.getDate()+i); d.setHours(h,m,0,0);
    if(i===0 && d < new Date()) continue;
    if(runsOn(t,d) && clinicOpen(t,d)) return d;
  }
  return null;
}
/* 今日は休診で動かないタスクか（バッジ表示用） */
function restingToday(t){
  if(!t.clinic || !CLOSED.size || t.status === "paused") return false;
  const d = new Date();
  return runsOn(t,d) && !clinicOpen(t,d);
}
const fmtNext = d => {
  if(!d) return "—";
  const n = new Date(), t0 = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const dd = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - t0)/86400000);
  const hm = pad(d.getHours())+":"+pad(d.getMinutes());
  return dd===0 ? "今日 "+hm : dd===1 ? "明日 "+hm : (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
};
const ago = iso => {
  if(!iso) return "";
  const s = (Date.now() - new Date(iso))/1000;
  if(s < 90) return "たった今";
  if(s < 3600) return Math.floor(s/60)+"分前";
  if(s < 86400) return Math.floor(s/3600)+"時間前";
  if(s < 86400*7) return Math.floor(s/86400)+"日前";
  const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate();
};

let D = null, filter = "";

function render(){
  const now = new Date(), T = D.tasks;

  const cnt = {ok:0, ng:0, pause:0, build:0};
  T.forEach(t => {
    const k = t.st.k;
    if(k === "ng") cnt.ng++; else if(k === "pause") cnt.pause++;
    else if(k === "build") cnt.build++; else cnt.ok++;
  });
  const tiles = [["ok",cnt.ok,"動いている"],["ng",cnt.ng,"失敗・要確認"],
                 ["pause",cnt.pause,"停止中"],["build",D.todos.length,"残作業・見届け"]];
  $("#tiles").innerHTML = tiles.map(([k,n,l]) =>
    `<button class="tile" data-k="${k}" aria-pressed="${filter===k}"><div class="n">${n}</div><div class="l">${l}</div></button>`).join("");
  $("#tiles").onclick = e => { const b = e.target.closest(".tile"); if(!b) return;
    if(b.dataset.k === "build"){ document.querySelectorAll("h2")[2].scrollIntoView({behavior:"smooth"}); return; }
    filter = (filter === b.dataset.k) ? "" : b.dataset.k; render(); };

  /* 本日の動き */
  const today = T.filter(t => t.at && t.status !== "paused" && runsOn(t, now));
  const slots = {}; today.forEach(t => (slots[t.at] = slots[t.at] || []).push(t));
  const keys = Object.keys(slots).sort();
  const hm = pad(now.getHours())+":"+pad(now.getMinutes());
  $("#tlh").textContent = `本日の動き（${now.getMonth()+1}/${now.getDate()} ${"日月火水木金土"[now.getDay()]}・${today.length}件）`;
  $("#tl").innerHTML = keys.length ? keys.map((k,i) => {
    const isNow = k <= hm && (!keys[i+1] || keys[i+1] > hm);
    return `<div class="slot${isNow?" now":""}"><div class="t">${k}<small>${slots[k].length}件</small></div><div class="items">` +
      slots[k].map(t => {
        const ran = t.st.started && new Date(t.st.started) > new Date(now.getFullYear(),now.getMonth(),now.getDate());
        const k2 = ran ? t.st.k : (t.st.k === "ng" ? "ng" : "wait");
        const mark = {ok:"✓",ng:"✕",run:"…",wait:"○",pause:"‒",build:"◇"}[k2] || "○";
        return `<button class="pill ${k2}" data-id="${t.no}">${mark}<span>${esc(t.short||t.name)}</span></button>`;
      }).join("") + `</div></div>`;
  }).join("") : `<div class="slot"><div class="muted">本日の定期実行はありません</div></div>`;

  /* 一覧 */
  let show = filter ? T.filter(t => t.st.k === filter || (filter==="ok" && ["ok","run","wait"].includes(t.st.k))) : T.slice();
  if(filter === "ok") show = T.filter(t => !["ng","pause","build"].includes(t.st.k));
  $("#fmark").textContent = filter ? `（絞り込み中：${show.length}件・もう一度押すと解除）` : `（全${T.length}件）`;
  show.sort((a,b) => (b.st.k==="ng") - (a.st.k==="ng") || a.no - b.no);
  $("#list").innerHTML = show.map(t => `
    <div class="row" data-id="${t.no}">
      <i class="dot ${t.st.k}"></i>
      <div class="nm"><b>${esc(t.name)}</b><i>${esc(t.sched)}${t.base==="pc"?"　🖥 PC実行":""}</i></div>
      <div class="c ${t.st.k==="ng"?"b":""}">${t.st.label}${t.st.started?"・"+ago(t.st.started):""}</div>
      <div class="c next">${restingToday(t) ? "休診 ／ " : ""}${fmtNext(nextRun(t))}</div>
      <div class="c dur">${t.st.dur!=null?t.st.dur+"秒":"—"}</div>
    </div>`).join("") || `<div class="slot"><div class="muted">該当なし</div></div>`;

  document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => detail(Number(el.dataset.id)));
}

function detail(no){
  const t = D.tasks.find(x => x.no === no); if(!t) return;
  const h = t.st.hist || [];
  $("#mbox").innerHTML = `
    <h3>${esc(t.name)}</h3>
    <div class="meta">#${t.no}　${esc(t.cat)}</div>
    <dl>
      <dt>いつ動く</dt><dd>${esc(t.sched)}</dd>
      <dt>次回</dt><dd>${fmtNext(nextRun(t))}${restingToday(t) ? "（本日は休診のため動きません）" : ""}</dd>
      <dt>最終実行</dt><dd>${t.st.started ? new Date(t.st.started).toLocaleString("ja-JP")
          + `（${t.st.label}${t.st.dur!=null?"・"+t.st.dur+"秒":""}）` : t.st.label}</dd>
      <dt>実行のしくみ</dt><dd>${esc(t.where)}</dd>
      ${t.note ? `<dt>メモ</dt><dd>${esc(t.note)}</dd>` : ""}
      ${t.st.why ? `<dt>注意</dt><dd class="err">${esc(t.st.why)}</dd>` : ""}
    </dl>
    ${h.length ? `<div class="muted" style="margin-top:14px">直近の実行（左が古い）</div>
      <div class="hist">${h.map(r => `<i class="${r.c==="success"?"ok":r.c==="failure"?"ng":"sk"}" title="${new Date(r.t).toLocaleString("ja-JP")} ${r.c}"></i>`).join("")}</div>` : ""}
    <div class="acts">
      ${t.st.url ? `<a href="${t.st.url}" target="_blank" rel="noopener">実行ログを開く</a>` : ""}
      ${t.wfurl ? `<a href="${t.wfurl}" target="_blank" rel="noopener">このタスクの履歴</a>` : ""}
      <span class="cls" onclick="document.getElementById('modal').classList.remove('on')">閉じる</span>
    </div>`;
  $("#modal").classList.add("on");
}
$("#modal").onclick = e => { if(e.target.id === "modal") e.currentTarget.classList.remove("on"); };

function boot(d){
  D = d;
  CLOSED = new Set((D.closed && D.closed.days) || []);
  $("#gate").remove(); $("#app").hidden = false;

  $("#stamp").innerHTML = `この画面は <b>${D.at} 時点</b>の状態です　／　自動更新は毎日 <b>5:30</b> と <b>21:30</b>`
    + (D.closed && D.closed.updated
        ? `<br>休診日カレンダー（アポツール）: <b>${esc(D.closed.updated)}</b> 取得・${(D.closed.days||[]).length}日分`
        : `<br><span class="err">休診日カレンダーが読めていません。次回の表示は曜日だけの計算です（お盆・年末年始がずれます）</span>`)
    + (D.warn && D.warn.length ? `<br><span class="err">読めなかったもの ${D.warn.length}件：${esc(D.warn.join(" / "))}</span>` : "");

  $("#todo").innerHTML = D.todos.map(t => `
    <div class="it"><i class="bd ${t.pri}"></i>
      <div><b>${esc(t.name)}</b><p>${esc(t.detail)}</p></div>
      <div class="due">${esc(t.due||"")}</div></div>`).join("");

  const u = D.usage, dt = new Date();
  const days = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  const est = Math.round(u.total / dt.getDate() * days);
  const cls = est > 2000 ? "d" : est > 1700 ? "w" : "";
  const top = Object.entries(u.per).sort((a,b) => b[1]-a[1]).slice(0,5);
  $("#quota").innerHTML = `
    <div class="hd"><b>${u.total}</b> 分 / 2,000分<span>（${dt.getMonth()+1}月・${u.runs}回の実行を集計）</span></div>
    <div class="bar ${cls}"><i style="width:${Math.min(100, u.total/2000*100)}%"></i></div>
    <div class="ft">${est>2000?"🚨":est>1700?"⚠️":"🟢"} 月末の着地見込み <b>約${est}分</b>
      　＜消費が多い順＞ ${top.map(([n,m]) => esc(n)+" "+m+"分").join(" ／ ")}</div>`;

  render();
  setInterval(render, 60000);          /* 時計だけ進める（データは焼き込み済み） */
}

(async () => {
  const saved = localStorage.getItem(LS.pw);
  if(saved){ try{ return boot(await unlock(saved)); }catch(e){ localStorage.removeItem(LS.pw); } }
  const tryPw = async () => {
    const pw = $("#pw").value.trim(); if(!pw) return;
    $("#ge").textContent = "";
    try{ const d = await unlock(pw); if($("#rem").checked) localStorage.setItem(LS.pw, pw); boot(d); }
    catch(e){ $("#ge").textContent = "合言葉が違います"; $("#pw").select(); }
  };
  $("#go").onclick = tryPw;
  $("#pw").onkeydown = e => { if(e.key === "Enter") tryPw(); };
  $("#pw").focus();
})();
</script>
</body>
</html>
