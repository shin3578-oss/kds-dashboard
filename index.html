<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#111827">
<title>自動化ダッシュボード｜医療法人社団KDS</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f6f8; --card:#fff; --fg:#111827; --sub:#64748b; --line:#e5e9ee;
  --ok:#059669; --ok-bg:#e7f6f0; --ng:#dc2626; --ng-bg:#fdeaea;
  --warn:#d97706; --warn-bg:#fdf3e3; --idle:#94a3b8; --idle-bg:#eef1f5;
  --build:#7c3aed; --build-bg:#f1eafe;
  --shadow:0 1px 2px rgba(16,32,48,.05),0 3px 14px rgba(16,32,48,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --sub:#8b98a5; --line:#242c36;
  --ok:#3fb950; --ok-bg:#10261a; --ng:#f85149; --ng-bg:#2d1416;
  --warn:#d29922; --warn-bg:#2b2110; --idle:#6e7b8b; --idle-bg:#1b2029;
  --build:#a371f7; --build-bg:#221631;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 14px rgba(0,0,0,.35);
}}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}

/* ---- 合言葉 ---- */
#gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:30px 26px;max-width:380px;width:100%;text-align:center}
#gate h1{font-size:19px;margin:0 0 6px}
#gate p{color:var(--sub);font-size:13px;margin:0 0 18px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;letter-spacing:.08em}
#gate button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-weight:700;cursor:pointer}
#gate .err{color:var(--ng);font-size:13px;height:18px;margin-top:8px}
#gate label{display:flex;gap:7px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin-top:12px}
#gate label input{width:auto}

/* ---- ヘッダ ---- */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
header h1{font-size:18px;margin:0;letter-spacing:.01em}
header .stamp{color:var(--sub);font-size:12px;margin-left:auto}
#reload{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;box-shadow:var(--shadow)}
#reload[disabled]{opacity:.5;cursor:default}

/* ---- サマリー ---- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.tile .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--sub);margin-top:2px}
.tile[data-k="ok"] .n{color:var(--ok)} .tile[data-k="ng"] .n{color:var(--ng)}
.tile[data-k="pause"] .n{color:var(--idle)} .tile[data-k="build"] .n{color:var(--build)}
.tile[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:-2px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.tile .n{font-size:26px}}

/* ---- 見出し ---- */
h2{font-size:14px;margin:22px 0 9px;color:var(--sub);font-weight:700;letter-spacing:.03em}

/* ---- タイムライン ---- */
.tl{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.slot{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot.now{background:var(--warn-bg)}
.slot .t{flex:0 0 62px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.slot .t small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.slot .items{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;border:1px solid transparent;cursor:pointer;max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng);font-weight:700}
.pill.run{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.wait{background:var(--idle-bg);color:var(--sub)}
.pill.pause{background:var(--idle-bg);color:var(--idle);text-decoration:line-through}

/* ---- 一覧 ---- */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:26px 1fr 128px 96px 78px;gap:10px;align-items:center;
  padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row .dot{width:11px;height:11px;border-radius:50%;justify-self:center}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)} .dot.run{background:var(--warn)}
.dot.wait{background:var(--idle)} .dot.pause{background:var(--idle);opacity:.45}
.dot.build{background:var(--build)}
.row .nm{min-width:0}
.row .nm b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm i{font-style:normal;font-size:11.5px;color:var(--sub)}
.row .c{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.row .c.b{color:var(--fg);font-weight:600}
@media(max-width:700px){
  .row{grid-template-columns:22px 1fr auto;gap:8px}
  .row .c.next,.row .c.dur{display:none}
}

/* ---- 残作業 ---- */
.todo{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.todo .it{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.todo .it:last-child{border-bottom:0}
.todo .bd{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:0 0 auto}
.bd.hi{background:var(--ng)} .bd.mid{background:var(--warn)} .bd.lo{background:var(--idle)}
.todo b{font-size:14px;font-weight:600;display:block}
.todo p{margin:1px 0 0;font-size:12.5px;color:var(--sub)}
.todo .due{font-size:11.5px;color:var(--sub);margin-left:auto;white-space:nowrap;padding-top:2px}

/* ---- 無料枠 ---- */
.quota{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.quota .hd{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub)}
.quota .hd b{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--idle-bg);margin-top:9px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar.w i{background:var(--warn)} .bar.d i{background:var(--ng)}
.quota .ft{font-size:12px;color:var(--sub);margin-top:7px}
.quota button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px}

/* ---- 詳細 ---- */
#modal{position:fixed;inset:0;background:rgba(8,12,18,.55);display:none;place-items:center;padding:18px;z-index:50}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:84dvh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal h3{margin:0 0 3px;font-size:17px}
#modal .meta{font-size:12px;color:var(--sub);margin-bottom:14px}
#modal dl{display:grid;grid-template-columns:82px 1fr;gap:7px 12px;margin:0;font-size:13.5px}
#modal dt{color:var(--sub)} #modal dd{margin:0;word-break:break-word}
#modal .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#modal a,#modal .cls{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;text-decoration:none;color:inherit;cursor:pointer;background:var(--bg)}
.hist{display:flex;gap:4px;margin-top:12px}
.hist i{flex:1;height:22px;border-radius:3px;background:var(--idle-bg)}
.hist i.ok{background:var(--ok)} .hist i.ng{background:var(--ng)} .hist i.sk{background:var(--idle);opacity:.35}
.err{color:var(--ng);font-size:13px}
.muted{color:var(--sub);font-size:12.5px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>自動化ダッシュボード</h1>
    <p>医療法人社団KDS</p>
    <input id="pw" type="password" placeholder="合言葉" autocomplete="current-password" enterkeyhint="go">
    <button id="go">ひらく</button>
    <div class="err" id="ge"></div>
    <label><input type="checkbox" id="rem" checked>この端末では次から聞かない</label>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>自動化ダッシュボード</h1>
    <button id="reload">更新</button>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2 id="tlh">本日の動き</h2>
  <div class="tl" id="tl"></div>

  <h2>タスク一覧 <span class="muted" id="fmark"></span></h2>
  <div class="list" id="list"></div>

  <h2>残作業・見届け待ち</h2>
  <div class="todo" id="todo"></div>

  <h2>GitHub Actions 無料枠</h2>
  <div class="quota" id="quota"></div>
</div>

<div id="modal"><div class="box" id="mbox"></div></div>

const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");

async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2a(ENC.salt), iterations:200000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2a(ENC.iv)}, key, b2a(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ================= スケジュール解釈 =================
   days: everyday / mon-sat / mon,wed / day:2 / day:10-14 / monthend / manual
   at:   "19:49"（無ければ時刻不明）                                        */
const DOW = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function runsOn(t, d){
  const s = t.days || "manual";
  if(s === "manual") return false;
  if(s === "everyday") return true;
  if(s === "monthend") return d.getDate() === new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  if(s.startsWith("day:")){
    const spec = s.slice(4);
    if(spec.includes("-")){ const [a,b] = spec.split("-").map(Number); return d.getDate()>=a && d.getDate()<=b; }
    return d.getDate() === Number(spec);
  }
  if(s.includes("-")){ const [a,b] = s.split("-").map(x => DOW[x]); return d.getDay()>=a && d.getDay()<=b; }
  return s.split(",").map(x => DOW[x]).includes(d.getDay());
}
function nextRun(t){
  if(!t.at || t.days === "manual") return null;
  const [h,m] = t.at.split(":").map(Number);
  for(let i=0;i<400;i++){
    const d = new Date(); d.setDate(d.getDate()+i); d.setHours(h,m,0,0);
    if(i===0 && d < new Date()) continue;
    if(runsOn(t,d)) return d;
  }
  return null;
}
const fmtNext = d => {
  if(!d) return "—";
  const n = new Date(), t0 = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const dd = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - t0)/86400000);
  const hm = pad(d.getHours())+":"+pad(d.getMinutes());
  if(dd===0) return "今日 "+hm;
  if(dd===1) return "明日 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
};
const ago = iso => {
  if(!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  if(s < 90) return "たった今";
  if(s < 3600) return Math.floor(s/60)+"分前";
  if(s < 86400) return Math.floor(s/3600)+"時間前";
  if(s < 86400*7) return Math.floor(s/86400)+"日前";
  const d = new Date(iso); return (d.getMonth()+1)+"/"+d.getDate();
};

/* ================= GitHub API ================= */
let D=null, RUNS={}, JOBS={}, ERRS=[];
const gh = async (path) => {
  const r = await fetch("https://api.github.com"+path, {
    headers:{Authorization:"Bearer "+D.tok, Accept:"application/vnd.github+json"}
  });
  if(!r.ok) throw new Error(path.split("?")[0]+" → "+r.status);
  return r.json();
};
/* 同時実行数を抑えて順に流す（GitHubに一気に投げない） */
async function pool(items, n, fn){
  const it = items[Symbol.iterator]();
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    for(let x = it.next(); !x.done; x = it.next()) await fn(x.value);
  }));
}

async function fetchAll(){
  ERRS = []; RUNS = {}; JOBS = {};
  /* 月次タスクは直近100件のrunに埋もれるので、ワークフロー単位で取りに行く */
  const pairs = [...new Set(D.tasks.filter(t => t.wf).map(t => t.repo+"|"+t.wf))];
  await pool(pairs, 8, async k => {
    const [repo, wf] = k.split("|");
    try{
      const j = await gh(`/repos/${repo}/actions/workflows/${wf}/runs?per_page=15&exclude_pull_requests=true`);
      RUNS[k] = j.workflow_runs || [];
    }catch(e){ ERRS.push(wf+" "+e.message.split(" → ")[1]); RUNS[k] = []; }
  });
  /* 複数タスクが同居するワークフローは、最新runのジョブ/ステップまで見る */
  await pool(D.probes, 8, async p => {
    const run = latestRun(p.repo, p.wf);
    if(!run) return;
    try{
      const j = await gh(`/repos/${p.repo}/actions/runs/${run.id}/jobs?per_page=100`);
      JOBS[p.repo+"|"+p.wf] = {run, jobs:j.jobs||[]};
    }catch(e){ ERRS.push(p.wf+" "+e.message.split(" → ")[1]); }
  });
}
const wfRuns = (repo, wf) => RUNS[repo+"|"+wf] || [];
const latestRun = (repo, wf) => wfRuns(repo, wf).find(r => r.status === "completed") || wfRuns(repo, wf)[0] || null;

/* タスク1件の状態を出す */
function state(t){
  if(t.status === "paused") return {k:"pause", label:"停止中", run:null};
  if(t.status === "building") return {k:"build", label:"構築中", run:null};
  if(!t.wf) return {k:"wait", label:t.base === "pc" ? "PC実行" : "―", run:null};
  const run = latestRun(t.repo, t.wf);
  if(!run) return {k:"wait", label:"記録なし", run:null};

  let concl = run.conclusion, started = run.run_started_at || run.created_at, dur = null, why = "";
  if(run.status !== "completed") concl = "running";
  else dur = (new Date(run.updated_at) - new Date(started))/1000;

  /* ステップ単位のタスクは、そのステップの結果で上書きする */
  if(t.job || t.step){
    const box = JOBS[t.repo+"|"+t.wf];
    if(box && box.run.id === run.id){
      const job = t.job ? box.jobs.find(j => j.name === t.job || (j.name||"").startsWith(t.job)) : box.jobs[0];
      if(!job){ why = "ジョブ未検出"; }
      else if(t.step){
        const st = (job.steps||[]).find(s => (s.name||"").includes(t.step));
        if(!st) why = "ステップ未検出";
        else{
          concl = job.status !== "completed" ? "running" : (st.conclusion || "skipped");
          if(st.completed_at) dur = (new Date(st.completed_at) - new Date(st.started_at))/1000;
        }
      }else{
        concl = job.status !== "completed" ? "running" : (job.conclusion || "skipped");
        dur = job.completed_at ? (new Date(job.completed_at) - new Date(job.started_at))/1000 : null;
      }
    }
  }
  const map = {success:["ok","正常"], failure:["ng","失敗"], cancelled:["ng","中止"], timed_out:["ng","時間切れ"],
               running:["run","実行中"], skipped:["wait","スキップ"], neutral:["wait","—"]};
  const [k,label] = map[concl] || ["wait", concl || "—"];
  return {k, label, run, started, dur, why};
}

/* ================= 描画 ================= */
let filter = "";
function render(){
  const now = new Date();
  const rows = D.tasks.map(t => ({t, s:state(t)}));

  /* サマリー */
  const cnt = {ok:0, ng:0, pause:0, build:0};
  rows.forEach(({t,s}) => {
    if(s.k === "ng") cnt.ng++;
    else if(s.k === "pause") cnt.pause++;
    else if(s.k === "build") cnt.build++;
    else if(s.k === "ok" || s.k === "run") cnt.ok++;
  });
  cnt.build += D.todos.length;
  const tiles = [["ok",cnt.ok,"正常に動いている"],["ng",cnt.ng,"失敗・要確認"],
                 ["pause",cnt.pause,"停止中"],["build",cnt.build,"構築中・残作業"]];
  $("#tiles").innerHTML = tiles.map(([k,n,l]) =>
    `<button class="tile" data-k="${k}" aria-pressed="${filter===k}"><div class="n">${n}</div><div class="l">${l}</div></button>`).join("");
  $("#tiles").onclick = e => { const b = e.target.closest(".tile"); if(!b) return;
    filter = (filter === b.dataset.k) ? "" : b.dataset.k; render(); };

  /* 本日のタイムライン */
  const today = rows.filter(({t}) => t.at && runsOn(t, now) && t.status !== "paused");
  const slots = {};
  today.forEach(x => { (slots[x.t.at] = slots[x.t.at] || []).push(x); });
  const keys = Object.keys(slots).sort();
  const hm = pad(now.getHours())+":"+pad(now.getMinutes());
  $("#tlh").textContent = `本日の動き（${now.getMonth()+1}/${now.getDate()} ${"日月火水木金土"[now.getDay()]}・${today.length}件）`;
  $("#tl").innerHTML = keys.length ? keys.map(k => {
    const isNow = k <= hm && keys[keys.indexOf(k)+1] > hm;
    return `<div class="slot${isNow?" now":""}"><div class="t">${k}<small>${slots[k].length}件</small></div><div class="items">` +
      slots[k].map(({t,s}) => {
        const done = s.run && new Date(s.started) > new Date(now.getFullYear(),now.getMonth(),now.getDate());
        const k2 = s.k === "pause" ? "pause" : (done ? s.k : (k > hm ? "wait" : (s.k === "ng" ? "ng" : "wait")));
        const mark = {ok:"✓",ng:"✕",run:"…",wait:"○",pause:"‒"}[k2];
        return `<button class="pill ${k2}" data-id="${t.no}">${mark}<span>${t.short||t.name}</span></button>`;
      }).join("") + `</div></div>`;
  }).join("") : `<div class="slot"><div class="items muted">本日の定期実行はありません（休診日・または月次のみの日）</div></div>`;

  /* 一覧 */
  let show = rows;
  if(filter === "ng") show = rows.filter(x => x.s.k === "ng");
  else if(filter === "pause") show = rows.filter(x => x.s.k === "pause");
  else if(filter === "build") show = rows.filter(x => x.s.k === "build");
  else if(filter === "ok") show = rows.filter(x => x.s.k === "ok" || x.s.k === "run");
  $("#fmark").textContent = filter ? `（絞り込み中：${show.length}件・もう一度押すと解除）` : `（全${rows.length}件）`;
  show.sort((a,b) => (a.s.k==="ng"?-1:0) - (b.s.k==="ng"?-1:0) || a.t.no - b.t.no);
  $("#list").innerHTML = show.map(({t,s}) => `
    <div class="row" data-id="${t.no}">
      <i class="dot ${s.k}"></i>
      <div class="nm"><b>${t.name}</b><i>${t.sched}${t.base==="pc"?"　🖥 PC実行":""}</i></div>
      <div class="c ${s.k==="ng"?"b":""}">${s.label}${s.run?"・"+ago(s.started):""}</div>
      <div class="c next">${fmtNext(nextRun(t))}</div>
      <div class="c dur">${s.dur!=null?Math.round(s.dur)+"秒":"—"}</div>
    </div>`).join("") || `<div class="slot"><div class="muted" style="padding:12px 14px">該当なし</div></div>`;

  /* 残作業 */
  $("#todo").innerHTML = D.todos.map(t => `
    <div class="it"><i class="bd ${t.pri}"></i>
      <div><b>${t.name}</b><p>${t.detail}</p></div>
      <div class="due">${t.due||""}</div></div>`).join("");

  $("#stamp").innerHTML = `最終取得 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}` +
    (ERRS.length ? `<br><span class="err">取得できなかったもの: ${ERRS.join(" / ")}</span>` : "") +
    `<br><span class="muted">台帳の更新 ${ENC.built}</span>`;

  document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => detail(Number(el.dataset.id)));
}

function detail(no){
  const t = D.tasks.find(x => x.no === no); if(!t) return;
  const s = state(t);
  const hist = wfRuns(t.repo, t.wf).slice(0,12).reverse();
  $("#mbox").innerHTML = `
    <h3>${t.name}</h3>
    <div class="meta">#${t.no}　${t.cat}</div>
    <dl>
      <dt>いつ動く</dt><dd>${t.sched}</dd>
      <dt>次回</dt><dd>${fmtNext(nextRun(t))}</dd>
      <dt>最終実行</dt><dd>${s.run ? new Date(s.started).toLocaleString("ja-JP") + `（${s.label}${s.dur!=null?"・"+Math.round(s.dur)+"秒":""}）` : s.label}</dd>
      <dt>実行基盤</dt><dd>${t.base === "pc" ? "PC タスクスケジューラ（GitHubからは見えないので参考表示）" : t.repo + " / " + t.wf + (t.job?" › "+t.job:"") + (t.step?" › "+t.step:"")}</dd>
      ${t.note ? `<dt>メモ</dt><dd>${t.note}</dd>` : ""}
      ${s.why ? `<dt>注意</dt><dd class="err">${s.why}</dd>` : ""}
    </dl>
    ${hist.length ? `<div class="muted" style="margin-top:14px">直近の実行（左が古い）</div>
    <div class="hist">${hist.map(r => `<i class="${r.conclusion==="success"?"ok":r.conclusion==="failure"?"ng":"sk"}" title="${new Date(r.run_started_at||r.created_at).toLocaleString("ja-JP")} ${r.conclusion||r.status}"></i>`).join("")}</div>` : ""}
    <div class="acts">
      ${s.run ? `<a href="${s.run.html_url}" target="_blank" rel="noopener">実行ログを開く</a>` : ""}
      ${t.base !== "pc" ? `<a href="https://github.com/${t.repo}/actions/workflows/${t.wf}" target="_blank" rel="noopener">このタスクの履歴</a>` : ""}
      <span class="cls" onclick="document.getElementById('modal').classList.remove('on')">閉じる</span>
    </div>`;
  $("#modal").classList.add("on");
}
$("#modal").onclick = e => { if(e.target.id === "modal") e.currentTarget.classList.remove("on"); };

/* ================= 無料枠 ================= */
async function quota(force){
  const box = $("#quota");
  const cache = sessionStorage.getItem("kd_quota");
  if(cache && !force){ paintQuota(JSON.parse(cache)); return; }
  box.innerHTML = `<div class="muted">計測中…　実行時間を<b>ジョブ単位で1分に切り上げて</b>合計します（GitHubの課金と同じ数え方）</div>`;

  const d = new Date();
  const m1 = `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;
  let total = 0, per = {}, runs = [];
  try{
    /* 月初からのrunを非公開リポジトリぶんだけ集める（公開リポジトリは無料無制限） */
    for(const rp of D.repos.filter(x => x.private)){
      for(let page=1; page<=5; page++){
        const j = await gh(`/repos/${rp.r}/actions/runs?per_page=100&page=${page}&created=%3E%3D${m1}&exclude_pull_requests=true`);
        const w = j.workflow_runs || [];
        w.forEach(x => runs.push({repo:rp.r, id:x.id, name:x.name}));
        if(w.length < 100) break;
      }
    }
    let done = 0;
    await pool(runs, 6, async run => {
      const j = await gh(`/repos/${run.repo}/actions/runs/${run.id}/jobs?per_page=100`);
      for(const job of (j.jobs||[])){
        if(!job.started_at || !job.completed_at) continue;
        const mi = Math.ceil((new Date(job.completed_at) - new Date(job.started_at))/60000) || 1;
        total += mi; per[run.name] = (per[run.name]||0) + mi;
      }
      if(++done % 20 === 0) box.querySelector(".muted").innerHTML = `計測中… ${done}/${runs.length}`;
    });
  }catch(e){
    box.innerHTML = `<div class="err">計測できませんでした（${e.message}）</div>
      <button onclick="quota(true)" style="margin-top:8px">もう一度</button>`; return;
  }
  const res = {total, per, runs:runs.length, at:Date.now()};
  sessionStorage.setItem("kd_quota", JSON.stringify(res));
  paintQuota(res);
}
function paintQuota(res){
  const d = new Date(), days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const est = Math.round(res.total / d.getDate() * days);
  const pct = Math.min(100, res.total/2000*100), cls = est>2000?"d":est>1700?"w":"";
  const top = Object.entries(res.per).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("#quota").innerHTML = `
    <div class="hd"><b>${res.total}</b> 分 / 2,000分　<span>（${d.getMonth()+1}月・${d.getDate()}日経過／${res.runs}回の実行を集計）</span></div>
    <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
    <div class="ft">${est>2000?"🚨":est>1700?"⚠️":"🟢"} 月末の着地見込み <b>約${est}分</b>
      　＜消費が多い順＞ ${top.map(([n,m])=>`${n} ${m}分`).join(" ／ ")}
      　<button onclick="quota(true)">計測し直す</button></div>`;
}

/* ================= 起動 ================= */
async function boot(d){
  D = d;
  $("#gate").remove(); $("#app").hidden = false;
  const go = async () => {
    $("#reload").disabled = true; $("#reload").textContent = "取得中…";
    await fetchAll(); render();
    $("#reload").disabled = false; $("#reload").textContent = "更新";
  };
  $("#reload").onclick = () => { go(); quota(true); };
  await go();
  quota(false);                                     /* 無料枠は重いので初回だけ（あとは手動） */
  setInterval(() => { if(!document.hidden) go(); }, 300000);   /* 5分ごとに自動更新 */
}

(async () => {
  const saved = localStorage.getItem(LS.pw);
  if(saved){ try{ return boot(await unlock(saved)); }catch(e){ localStorage.removeItem(LS.pw); } }
  const tryPw = async () => {
    const pw = $("#pw").value.trim(); if(!pw) return;
    $("#ge").textContent = "";
    try{ const d = await unlock(pw); if($("#rem").checked) localStorage.setItem(LS.pw, pw); boot(d); }
    catch(e){ $("#ge").textContent = "合言葉が違います"; $("#pw").select(); }
  };
  $("#go").onclick = tryPw;
  $("#pw").onkeydown = e => { if(e.key === "Enter") tryPw(); };
  $("#pw").focus();
})();
</script>
